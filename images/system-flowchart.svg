<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="2360" viewBox="0 0 980 2360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="980" height="2360" fill="#ffffff"/>

<text x="490" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f766e">Medical Prescription System for Drug-Drug Interaction using OCR and Machine Learning</text>
<text x="490" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b746f">System flowchart</text>
<text x="40" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f3d38">1. Parts of the system</text>
<rect x="75.0" y="147.0" width="250" height="86" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="200" y="184.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">
<tspan x="200" dy="0">prescriptions.db</tspan>
<tspan x="200" dy="19">SQL — patients</tspan>
</text>
<rect x="365.0" y="147.0" width="250" height="86" rx="10" fill="#d9f2ea" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="184.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">
<tspan x="490" dy="0">Web page</tspan>
<tspan x="490" dy="19">HTML + CSS + JavaScript</tspan>
</text>
<rect x="655.0" y="147.0" width="250" height="86" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="780" y="184.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">
<tspan x="780" dy="0">pharmacy.db</tspan>
<tspan x="780" dy="19">SQL — drugs + DDI</tspan>
</text>
<text x="490" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b746f">The page runs SQL on the two SQLite databases.</text>
<text x="40" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f3d38">2. Check process</text>
<ellipse cx="490" cy="360" rx="85.0" ry="26.0" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Start</text>
<line x1="490" y1="386" x2="490" y2="418" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310.0" y="402.0" width="360" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">User opens index.html</text>
<line x1="490" y1="458" x2="490" y2="490" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280.0" y="488.0" width="420" height="64" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="514.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">
<tspan x="490" dy="0">Enter medicines</tspan>
<tspan x="490" dy="19">sample patient or type names</tspan>
</text>
<line x1="490" y1="552" x2="490" y2="588" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="490,585.0 630.0,640 490,695.0 350.0,640" fill="#fff8e8" stroke="#b45309" stroke-width="2"/>
<text x="490" y="635.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
<tspan x="490" dy="0">Is the input</tspan>
<tspan x="490" dy="18">empty?</tspan>
</text>
<line x1="630" y1="640" x2="760" y2="640" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="690" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Yes</text>
<rect x="710.0" y="605.0" width="220" height="70" rx="10" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="820" y="645" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9b1c1c">Show Empty field</text>
<line x1="820" y1="675" x2="820" y2="758" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="820" cy="790" rx="75.0" ry="25.0" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="820" y="795" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">End</text>
<text x="512" y="708" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">No</text>
<line x1="490" y1="695" x2="490" y2="748" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290.0" y="762.0" width="400" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="795" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">Split the text into drug names</text>
<line x1="490" y1="818" x2="490" y2="850" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="282.0,848.0 720.0,848.0 698.0,912.0 260.0,912.0" fill="#e8f6f3" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="875.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1f3d38">
<tspan x="490" dy="0">SQL: match name in pharmacy.db</tspan>
<tspan x="490" dy="18">(scientific name or trade name)</tspan>
</text>
<line x1="490" y1="912" x2="490" y2="948" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="490,955.0 630.0,1010 490,1065.0 350.0,1010" fill="#fff8e8" stroke="#b45309" stroke-width="2"/>
<text x="490" y="1005.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
<tspan x="490" dy="0">Name found in</tspan>
<tspan x="490" dy="18">the catalog?</tspan>
</text>
<line x1="220" y1="1010" x2="350" y2="1010" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="998" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">No</text>
<rect x="50.0" y="971.0" width="220" height="78" rx="10" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="160" y="1004.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9b1c1c">
<tspan x="160" dy="0">Not available</tspan>
<tspan x="160" dy="19">user can add to a list</tspan>
</text>
<path d="M 160 1049 L 160 1140 L 470 1140" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="512" y="1078" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Yes</text>
<line x1="490" y1="1065" x2="490" y2="1118" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270.0" y="1134.0" width="440" height="72" rx="10" fill="#d9f2ea" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="1164.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">
<tspan x="490" dy="0">In stock</tspan>
<tspan x="490" dy="19">ingredient, trade names, side effects</tspan>
</text>
<line x1="490" y1="1206" x2="490" y2="1240" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="490,1240.0 640.0,1300 490,1360.0 340.0,1300" fill="#fff8e8" stroke="#b45309" stroke-width="2"/>
<text x="490" y="1295.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
<tspan x="490" dy="0">Two or more drugs</tspan>
<tspan x="490" dy="18">in stock?</tspan>
</text>
<line x1="640" y1="1300" x2="780" y2="1300" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="1288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">No</text>
<path d="M 780 1300 L 850 1300 L 850 1960 L 670 1960" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="512" y="1374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Yes</text>
<line x1="490" y1="1360" x2="490" y2="1412" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="292.0,1440.0 710.0,1440.0 688.0,1500.0 270.0,1500.0" fill="#e8f6f3" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="1475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1f3d38">SQL: SELECT from interaction</text>
<line x1="490" y1="1500" x2="490" y2="1534" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="490,1540.0 640.0,1600 490,1660.0 340.0,1600" fill="#fff8e8" stroke="#b45309" stroke-width="2"/>
<text x="490" y="1595.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c2d12">
<tspan x="490" dy="0">Interaction row</tspan>
<tspan x="490" dy="18">found?</tspan>
</text>
<line x1="220" y1="1600" x2="340" y2="1600" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="1588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Yes</text>
<rect x="50.0" y="1561.0" width="220" height="78" rx="10" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="160" y="1594.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9b1c1c">
<tspan x="160" dy="0">Show interaction</tspan>
<tspan x="160" dy="19">warning</tspan>
</text>
<path d="M 160 1639 L 160 1760 L 470 1760" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="512" y="1674" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">No</text>
<line x1="490" y1="1660" x2="490" y2="1712" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290.0" y="1762.0" width="400" height="56" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="1795" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">No interaction in this list</text>
<line x1="490" y1="1818" x2="490" y2="1852" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310.0" y="1872.0" width="360" height="56" rx="10" fill="#d9f2ea" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="1905" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1f3d38">Show final result on screen</text>
<line x1="490" y1="1928" x2="490" y2="1962" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<ellipse cx="490" cy="2010" rx="85.0" ry="26.0" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="490" y="2015" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">End</text>
<text x="40" y="2110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f3d38">3. Result types</text>
<rect x="70" y="2140" width="180" height="78" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="160" y="2172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f3d38">Empty field</text>
<text x="160" y="2196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b746f">Check with no text</text>
<rect x="270" y="2140" width="180" height="78" rx="10" fill="#d9f2ea" stroke="#0f766e" stroke-width="2"/>
<text x="360" y="2172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f3d38">In stock</text>
<text x="360" y="2196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b746f">Name matched the catalog</text>
<rect x="470" y="2140" width="180" height="78" rx="10" fill="#fde2e2" stroke="#0f766e" stroke-width="2"/>
<text x="560" y="2172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f3d38">Not available</text>
<text x="560" y="2196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b746f">Name not in the catalog</text>
<rect x="670" y="2140" width="180" height="78" rx="10" fill="#fde2e2" stroke="#0f766e" stroke-width="2"/>
<text x="760" y="2172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1f3d38">Drug interaction</text>
<text x="760" y="2196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b746f">A pair is in the table</text>
<text x="490" y="2268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b746f">If two or more drugs are in stock and no pair is in the table: No interaction in this list.</text>
<text x="490" y="2310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b746f">Section 2800-23  ·  Supervisor: Prasanalakshmi Balaji</text>
</svg>
