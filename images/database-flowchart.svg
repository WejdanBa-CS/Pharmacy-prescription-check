<text x="40" y="470" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f3d38">How the two databases connect</text>
<rect x="40" y="490" width="1400" height="70" rx="10" fill="#f3faf8" stroke="#cde5df"/>
<text x="740" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#1f3d38">prescriptions.db.PRESCRIPTION_ITEM.medicine_name   matches   pharmacy.db.TRADE_NAME or DRUG.scientific_name</text>
<text x="740" y="544" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5b746f">Example: Panadol in a prescription  →  TRADE_NAME Panadol  →  DRUG Paracetamol</text>
